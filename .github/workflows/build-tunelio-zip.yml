name: Tunelio ZIP Source - Android APK
# Trigger a fresh validation build for the latest UI, splash, and VPN-state fixes.
# Rebuild after restoring Expo's automatic splash-screen dismissal.
# Validate startup theme gating to reduce splash-to-UI flash.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'assets/**'
      - 'components/**'
      - 'constants/**'
      - 'hooks/**'
      - 'lib/**'
      - 'modules/**'
      - 'plugins/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'app.config.ts'
      - 'expo-env.d.ts'
      - 'tsconfig.json'
      - '.github/workflows/build-tunelio-zip.yml'

concurrency:
  group: tunelio-android-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-tunelio-zip:
    name: Build APK from Tunelio ZIP source
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout branch source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Go for sing-box libbox
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          check-latest: true

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Expo project configuration
        run: |
          pnpm exec expo --version
          pnpm exec expo config --type public

      - name: Generate CoreBox branding assets
        run: |
          pnpm dlx sharp-cli -i assets/images/corebox-mark.svg -o assets/images/icon.png resize 1024 1024
          pnpm dlx sharp-cli -i assets/images/corebox-foreground.svg -o assets/images/android-icon-foreground.png resize 1024 1024
          pnpm dlx sharp-cli -i assets/images/corebox-background.svg -o assets/images/android-icon-background.png resize 1024 1024
          pnpm dlx sharp-cli -i assets/images/corebox-foreground.svg -o assets/images/android-icon-monochrome.png resize 1024 1024
          pnpm dlx sharp-cli -i assets/images/corebox-splash.svg -o assets/images/splash-icon.png resize 1024 1024

      - name: Generate native Android project
        run: pnpm exec expo prebuild --platform android --no-install

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;28.0.13004108"

      - name: Build sing-box libbox AAR
        run: bash scripts/build-libbox-android.sh

      - name: Build debug and release APKs
        working-directory: android
        env:
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g"
        run: |
          chmod +x gradlew
          if grep -q '^org.gradle.jvmargs=' gradle.properties; then
            sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8/' gradle.properties
          else
            echo 'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' >> gradle.properties
          fi
          printf '\norg.gradle.workers.max=2\n' >> gradle.properties
          ./gradlew --no-daemon assembleDebug assembleRelease
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/release/app-release.apk
          echo "Release APK size:"
          du -h app/build/outputs/apk/release/app-release.apk
          echo "Largest APK entries (uncompressed):"
          unzip -l app/build/outputs/apk/release/app-release.apk | awk 'NR>3 && $4 != "" {print $1, $4}' | sort -nr | head -n 30
          echo "Native libraries packaged in APK:"
          unzip -Z1 app/build/outputs/apk/release/app-release.apk | grep -E '^lib/[^/]+/[^/]+\.so$' | sort || true
          echo "Native library ABI folders:"
          unzip -Z1 app/build/outputs/apk/release/app-release.apk | grep -E '^lib/[^/]+/[^/]+\.so$' | cut -d/ -f2 | sort -u || true
          echo "Validate APK ZIP structure"
          unzip -t app/build/outputs/apk/release/app-release.apk
          echo "Validate APK signature and alignment"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          test -n "$ZIPALIGN"
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk
          "$ZIPALIGN" -c -v 4 app/build/outputs/apk/release/app-release.apk
          unzip -l app/build/outputs/apk/release/app-release.apk | grep -E 'assets/index\.android\.bundle'

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tunelio-zip-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
