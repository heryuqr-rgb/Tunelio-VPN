name: Android APK Build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'assets/**'
      - 'components/**'
      - 'constants/**'
      - 'hooks/**'
      - 'lib/**'
      - 'modules/**'
      - 'plugins/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'app.config.ts'
      - 'expo-env.d.ts'
      - 'tsconfig.json'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android standalone APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Go for sing-box libbox
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          check-latest: true

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Expo project configuration
        run: |
          pnpm exec expo --version
          pnpm exec expo config --type public

      - name: Generate native Android project
        run: pnpm exec expo prebuild --platform android --no-install

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;28.0.13004108"

      - name: Build pinned sing-box libbox AAR
        run: bash scripts/build-libbox-android.sh

      - name: Build debug and standalone release APKs
        working-directory: android
        env:
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g"
        run: |
          chmod +x gradlew
          # D8 ran out of Java heap while merging the release dex archives.
          # Give Gradle and its D8 workers a larger heap and limit parallel workers.
          if grep -q '^org.gradle.jvmargs=' gradle.properties; then
            sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8/' gradle.properties
          else
            echo 'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' >> gradle.properties
          fi
          printf '\norg.gradle.workers.max=2\n' >> gradle.properties
          cat gradle.properties
          ./gradlew --no-daemon assembleDebug assembleRelease

          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$DEBUG_APK"
          test -s "$RELEASE_APK"

          echo "Debug APK size:"
          du -h "$DEBUG_APK"
          echo "Standalone release APK size:"
          du -h "$RELEASE_APK"

          echo "Checking embedded JavaScript bundle in release APK..."
          unzip -l "$RELEASE_APK" | grep -E 'assets/index\.android\.bundle' || {
            echo "ERROR: JavaScript bundle is missing from release APK."
            exit 1
          }

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tunelio-vpn-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload standalone release APK
        uses: actions/upload-artifact@v4
        with:
          name: tunelio-vpn-standalone-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
