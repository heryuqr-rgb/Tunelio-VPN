name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'assets/**'
      - 'components/**'
      - 'constants/**'
      - 'hooks/**'
      - 'lib/**'
      - 'modules/**'
      - 'plugins/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'app.config.ts'
      - 'expo-env.d.ts'
      - 'tsconfig.json'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android standalone APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Go for sing-box libbox
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          check-latest: true

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Expo project configuration
        run: |
          pnpm exec expo --version
          pnpm exec expo config --type public

      - name: Generate native Android project
        run: pnpm exec expo prebuild --platform android --no-install

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;28.0.13004108"

      - name: Build pinned sing-box libbox AAR
        run: bash scripts/build-libbox-android.sh

      - name: Build standalone release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          echo "APK size:"
          du -h "$APK"
          echo "Checking embedded React Native bundle..."
          unzip -l "$APK" | grep -E 'assets/index\.android\.bundle' || {
            echo "ERROR: JavaScript bundle is missing from APK."
            exit 1
          }

      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: tunelio-vpn-standalone-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
