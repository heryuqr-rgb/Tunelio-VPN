plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.singbox'
version = '1.0.0'

android {
  namespace 'expo.modules.singbox'
  defaultConfig {
    minSdkVersion 24
    versionCode 1
    versionName "1.0.0"
  }
  sourceSets {
    main {
      jniLibs.srcDirs += ['libs']
    }
  }
}

dependencies {
  // Compile against upstream libbox bindings; the config plugin packages the AAR in :app.
  compileOnly files(rootProject.file('../modules/singbox-android/android/libs/libbox.aar'))
}
