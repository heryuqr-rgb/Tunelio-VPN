plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.singbox'
version = '1.0.0'

android {
  namespace 'expo.modules.singbox'
  defaultConfig {
    minSdkVersion 24
    versionCode 1
    versionName '1.0.0'
  }
  sourceSets {
    main {
      jniLibs.srcDirs += ['libs']
    }
  }
}

dependencies {
  implementation files('libs/libbox.aar')
}

// This Expo module is consumed as a project dependency by the app. Android Gradle
// cannot bundle a local AAR inside another AAR; the app must merge libbox.aar
// directly from this module's dependency instead of publishing this module as an AAR.
tasks.configureEach {
  if (name == 'bundleDebugAar' || name == 'bundleReleaseAar') {
    enabled = false
  }
}
